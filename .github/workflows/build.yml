name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Même signature que l'Android Studio de Theo : la mise à jour s'installe par-dessus, sans perdre les données
      - name: Clé de signature
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::warning::Secret KEYSTORE_PASS absent : compilation de vérification seulement, rien n'est publié."
            echo "NOKEY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in signing/debug.keystore.enc -out "$RUNNER_TEMP/debug.keystore" -pass env:KEYSTORE_PASS
          echo "HUSH_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass android | grep -i "SHA" || true

      # Identifiants de l'API Tidal, gardés dans les secrets du dépôt
      - name: Identifiants Tidal
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
        run: |
          if [ -z "$TIDAL_CLIENT_ID" ] || [ -z "$TIDAL_CLIENT_SECRET" ]; then
            echo "::warning::Secrets Tidal absents : compilation pour vérifier, mais pas de version publiée."
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi
          printf 'tidal.clientId=%s\ntidal.clientSecret=%s\n' "$TIDAL_CLIENT_ID" "$TIDAL_CLIENT_SECRET" > local.properties

      - name: Compiler
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk Hush.apk

      # Garde-fou : on ne publie jamais un APK qui n'a pas la bonne signature
      - name: Vérifier la signature
        if: env.NOKEY != 'true'
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$($APKSIGNER verify --print-certs Hush.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          WANT=$(keytool -exportcert -keystore "$HUSH_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')
          echo "APK : $GOT"; echo "Clé : $WANT"
          if [ "$GOT" != "$WANT" ]; then echo "::error::Mauvaise signature, rien n'est publié."; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Hush-apk
          path: Hush.apk

      - name: Publier la version
        if: env.PUBLISH == 'true' && env.NOKEY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Hush 1.${{ github.run_number }}
          files: Hush.apk
          make_latest: true
